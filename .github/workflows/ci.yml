name: Community source CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: community-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:client
      - run: pnpm check:dsh
      - run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: pnpm test:contract
      - run: pnpm test:bindings
      - name: Configure Docker socket for isolated tests
        run: |
          mkdir -p "$HOME/.orbstack/run"
          ln -sf /var/run/docker.sock "$HOME/.orbstack/run/docker.sock"
      - run: pnpm setup:dsh
      - run: pnpm test:repo
      - run: pnpm test:references
      - run: pnpm test:extensions
      - run: pnpm test:native
      - run: pnpm test:work
