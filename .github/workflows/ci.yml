name: Community source CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: community-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: checks
            suite: checks
          - name: bindings 1/4
            suite: bindings
            shard: 1
          - name: bindings 2/4
            suite: bindings
            shard: 2
          - name: bindings 3/4
            suite: bindings
            shard: 3
          - name: bindings 4/4
            suite: bindings
            shard: 4
          - name: native
            suite: native
          - name: work
            suite: work
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:client
        if: matrix.suite == 'checks'
      - run: pnpm check:dsh
        if: matrix.suite == 'checks'
      - run: pnpm typecheck
        if: matrix.suite == 'checks'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: pnpm test:contract
        if: matrix.suite == 'checks'
      - run: pnpm test:sdk
        if: matrix.suite == 'checks'
      - name: Run bindings shard ${{ matrix.shard }}/4
        if: matrix.suite == 'bindings'
        timeout-minutes: 25
        run: node --test --test-shard=${{ matrix.shard }}/4 --test-concurrency=2 --test-timeout=180000 packages/client/ui-workbench/tests/*.test.ts packages/client/ui-workbench/tests/*.test.mjs
      - name: Configure Docker socket for isolated tests
        if: matrix.suite != 'bindings'
        run: |
          mkdir -p "$HOME/.orbstack/run"
          ln -sf /var/run/docker.sock "$HOME/.orbstack/run/docker.sock"
      - run: pnpm setup:dsh
        if: matrix.suite != 'bindings'
      - run: pnpm test:repo
        if: matrix.suite == 'checks'
      - run: pnpm test:references
        if: matrix.suite == 'checks'
      - run: pnpm test:extensions
        if: matrix.suite == 'checks'
      - run: pnpm test:runtime-packages
        if: matrix.suite == 'checks'
      - run: pnpm test:native
        if: matrix.suite == 'native'
      - run: pnpm test:work
        if: matrix.suite == 'work'
  check:
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require all test jobs to succeed
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
        run: test "$TESTS_RESULT" = success
