name: Community source CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: community-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: checks
            suite: checks
          - name: bindings 1/4
            suite: bindings
            shard: 1
          - name: bindings 2/4
            suite: bindings
            shard: 2
          - name: bindings 3/4
            suite: bindings
            shard: 3
          - name: bindings 4/4
            suite: bindings
            shard: 4
          - name: native 1/4
            suite: native
            shard: 1
          - name: native 2/4
            suite: native
            shard: 2
          - name: native 3/4
            suite: native
            shard: 3
          - name: native 4/4
            suite: native
            shard: 4
          - name: work
            suite: work
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Free unused hosted SDKs for PostgreSQL tests
        if: runner.environment == 'github-hosted' && runner.os == 'Linux' && matrix.suite != 'bindings'
        shell: bash
        run: |
          # 本次临时 runner 不构建 Android/.NET；保留项目、Node、Python 和 Docker。
          # 官方镜像安装位置见 actions/runner-images 的 install-android-sdk.sh 与 install-dotnetcore-sdk.sh。
          df -B1 --output=avail,target "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
          for path in /usr/local/lib/android /usr/share/dotnet; do
            if [[ -e "$path" || -L "$path" ]]; then
              [[ -d "$path" && ! -L "$path" && "$(readlink -f -- "$path")" == "$path" ]] || exit 1
              sudo rm -rf -- "$path"
            fi
          done
          df -B1 --output=avail,target "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:client
        if: matrix.suite == 'checks'
      - run: pnpm check:dsh
        if: matrix.suite == 'checks'
      - run: pnpm typecheck
        if: matrix.suite == 'checks'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: pnpm test:contract
        if: matrix.suite == 'checks'
      - run: pnpm test:sdk
        if: matrix.suite == 'checks'
      - name: Install locked Playwright WebKit and Firefox
        if: matrix.suite == 'bindings'
        run: |
          # Keep Ubuntu signatures and suites; avoid the slow hosted Azure apt mirror.
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's|://azure.archive.ubuntu.com/ubuntu|://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          node --input-type=module <<'JS'
          import {readdirSync} from 'node:fs'
          import {createRequire} from 'node:module'
          import {dirname,resolve} from 'node:path'
          import {spawnSync} from 'node:child_process'
          const require=createRequire(resolve('package.json'))
          const name=process.env.TELOA_TEST_PLAYWRIGHT??'playwright'
          let manifest
          try{manifest=require.resolve(name+'/package.json')}catch{
            const store=resolve('node_modules/.pnpm')
            const installed=readdirSync(store).find(entry=>entry.startsWith('playwright@'))
            if(!installed)throw Error('The current worktree has no locked Playwright installation.')
            manifest=resolve(store,installed,'node_modules/playwright/package.json')
          }
          const result=spawnSync(process.execPath,[resolve(dirname(manifest),'cli.js'),'install','--with-deps','webkit','firefox'],{stdio:'inherit'})
          if(result.error)throw result.error
          if(result.status!==0)process.exit(result.status??1)
          JS
      - name: Run bindings shard ${{ matrix.shard }}/4
        if: matrix.suite == 'bindings'
        timeout-minutes: 25
        run: node --test --test-shard=${{ matrix.shard }}/4 --test-concurrency=2 --test-timeout=180000 packages/client/ui-workbench/tests/*.test.ts packages/client/ui-workbench/tests/*.test.mjs
      - name: Configure Docker socket for isolated tests
        if: matrix.suite != 'bindings'
        run: |
          mkdir -p "$HOME/.orbstack/run"
          ln -sf /var/run/docker.sock "$HOME/.orbstack/run/docker.sock"
      - run: pnpm setup:dsh
        if: matrix.suite != 'bindings'
      - run: pnpm test:repo
        if: matrix.suite == 'checks'
      - run: pnpm test:references
        if: matrix.suite == 'checks'
      - run: pnpm test:extensions
        if: matrix.suite == 'checks'
      - run: pnpm test:runtime-packages
        if: matrix.suite == 'checks'
      - run: pnpm test:native
        if: matrix.suite == 'native'
        env:
          NODE_OPTIONS: --test-shard=${{ matrix.shard }}/4
      - run: pnpm test:work
        if: matrix.suite == 'work'
  check:
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require all test jobs to succeed
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
        run: test "$TESTS_RESULT" = success
